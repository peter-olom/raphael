services:
  raphael-init:
    image: busybox:1.36.1
    container_name: raphael-init
    command: ["sh", "-c", "mkdir -p /data && chown -R 65532:65532 /data && chmod 700 /data"]
    volumes:
      - raphael-data:/data
    restart: "no"

  raphael:
    build: .
    container_name: raphael
    depends_on:
      raphael-init:
        condition: service_completed_successfully
    ports:
      - "${RAPHAEL_HOST_BIND:-0.0.0.0}:6274:6274"
    volumes:
      - raphael-data:/data
    environment:
      - PORT=6274
      - RAPHAEL_DB_PATH=/data/raphael.db
      - NODE_ENV=production
      - RAPHAEL_AUTH_ENABLED=${RAPHAEL_AUTH_ENABLED:-false}
      - RAPHAEL_AUTH_EMAIL_PASSWORD_ENABLED=${RAPHAEL_AUTH_EMAIL_PASSWORD_ENABLED:-false}
      - RAPHAEL_ADMIN_EMAIL=${RAPHAEL_ADMIN_EMAIL:-}
      - RAPHAEL_ADMIN_PASSWORD=${RAPHAEL_ADMIN_PASSWORD:-}
      - RAPHAEL_AUTH_SESSION_TTL_HOURS=${RAPHAEL_AUTH_SESSION_TTL_HOURS:-}
      - RAPHAEL_AUTH_TRUSTED_ORIGINS=${RAPHAEL_AUTH_TRUSTED_ORIGINS:-}
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET:-}
      - BETTER_AUTH_BASE_URL=${BETTER_AUTH_BASE_URL:-}
      - BETTER_AUTH_URL=${BETTER_AUTH_URL:-}
      - RAPHAEL_AUTH_GOOGLE_CLIENT_ID=${RAPHAEL_AUTH_GOOGLE_CLIENT_ID:-}
      - RAPHAEL_AUTH_GOOGLE_CLIENT_SECRET=${RAPHAEL_AUTH_GOOGLE_CLIENT_SECRET:-}
      - RAPHAEL_AUTH_GITHUB_CLIENT_ID=${RAPHAEL_AUTH_GITHUB_CLIENT_ID:-}
      - RAPHAEL_AUTH_GITHUB_CLIENT_SECRET=${RAPHAEL_AUTH_GITHUB_CLIENT_SECRET:-}
      - RAPHAEL_AUTH_AZURE_TENANT_ID=${RAPHAEL_AUTH_AZURE_TENANT_ID:-}
      - RAPHAEL_AUTH_AZURE_CLIENT_ID=${RAPHAEL_AUTH_AZURE_CLIENT_ID:-}
      - RAPHAEL_AUTH_AZURE_CLIENT_SECRET=${RAPHAEL_AUTH_AZURE_CLIENT_SECRET:-}
      - RAPHAEL_AUTH_GENERIC_OAUTH=${RAPHAEL_AUTH_GENERIC_OAUTH:-}
      - RAPHAEL_ALLOW_UNAUTH_ADMIN=${RAPHAEL_ALLOW_UNAUTH_ADMIN:-}
      - RAPHAEL_ALLOW_FIRST_USER_ADMIN=${RAPHAEL_ALLOW_FIRST_USER_ADMIN:-}
      - RAPHAEL_CORS_ORIGINS=${RAPHAEL_CORS_ORIGINS:-}
      - RAPHAEL_TRUST_PROXY=${RAPHAEL_TRUST_PROXY:-loopback}
      - RAPHAEL_INGEST_MAX_ITEMS=${RAPHAEL_INGEST_MAX_ITEMS:-5000}
      - RAPHAEL_INGEST_RATE_LIMIT_REQUESTS_PER_MINUTE=${RAPHAEL_INGEST_RATE_LIMIT_REQUESTS_PER_MINUTE:-600}
      - RAPHAEL_INGEST_RATE_LIMIT_ITEMS_PER_MINUTE=${RAPHAEL_INGEST_RATE_LIMIT_ITEMS_PER_MINUTE:-60000}
      - RAPHAEL_INGEST_RATE_LIMIT_BURST_MULTIPLIER=${RAPHAEL_INGEST_RATE_LIMIT_BURST_MULTIPLIER:-2}
      - RAPHAEL_RETENTION_ENABLED=${RAPHAEL_RETENTION_ENABLED:-true}
      - RAPHAEL_RETENTION_INTERVAL_MS=${RAPHAEL_RETENTION_INTERVAL_MS:-172800000}
      - RAPHAEL_RETENTION_INITIAL_DELAY_MS=${RAPHAEL_RETENTION_INITIAL_DELAY_MS:-15000}
      - RAPHAEL_MAINTENANCE_TIME_UTC=${RAPHAEL_MAINTENANCE_TIME_UTC:-}
      - RAPHAEL_MAINTENANCE_VACUUM_POLICY=${RAPHAEL_MAINTENANCE_VACUUM_POLICY:-full}
      - RAPHAEL_MAINTENANCE_VACUUM_MIN_BYTES=${RAPHAEL_MAINTENANCE_VACUUM_MIN_BYTES:-67108864}
      - RAPHAEL_INGEST_QUEUE_MAX_BYTES=${RAPHAEL_INGEST_QUEUE_MAX_BYTES:-1073741824}
      - RAPHAEL_INGEST_QUEUE_MAX_ITEMS=${RAPHAEL_INGEST_QUEUE_MAX_ITEMS:-10000}
      - RAPHAEL_INGEST_QUEUE_MAX_INFLIGHT_BYTES=${RAPHAEL_INGEST_QUEUE_MAX_INFLIGHT_BYTES:-33554432}
      - SQLITE_TMPDIR=${SQLITE_TMPDIR:-}
      - RAPHAEL_INGEST_QUEUE_DIR=${RAPHAEL_INGEST_QUEUE_DIR:-}
      - RAPHAEL_SQLITE_INCREMENTAL_VACUUM_MAX_PAGES=${RAPHAEL_SQLITE_INCREMENTAL_VACUUM_MAX_PAGES:-2048}
      - RAPHAEL_INGEST_MAX_FUTURE_SKEW_MS=${RAPHAEL_INGEST_MAX_FUTURE_SKEW_MS:-300000}
      - RAPHAEL_MIN_FREE_DISK_BYTES=${RAPHAEL_MIN_FREE_DISK_BYTES:-268435456}
      - RAPHAEL_PRUNE_BATCH_SIZE=${RAPHAEL_PRUNE_BATCH_SIZE:-1000}
      - RAPHAEL_PRUNE_MAX_RUNTIME_MS=${RAPHAEL_PRUNE_MAX_RUNTIME_MS:-30000}
      - RAPHAEL_SEARCH_ATTRIBUTES_ENABLED=${RAPHAEL_SEARCH_ATTRIBUTES_ENABLED:-false}
      - RAPHAEL_WS_MAX_PAYLOAD_BYTES=${RAPHAEL_WS_MAX_PAYLOAD_BYTES:-65536}
      - RAPHAEL_WS_MAX_BUFFERED_BYTES=${RAPHAEL_WS_MAX_BUFFERED_BYTES:-1048576}
      - RAPHAEL_PRUNE_COMPACT_AFTER_DELETE=${RAPHAEL_PRUNE_COMPACT_AFTER_DELETE:-true}
      - RAPHAEL_SQLITE_FULL_VACUUM_MIN_FREE_PAGES=${RAPHAEL_SQLITE_FULL_VACUUM_MIN_FREE_PAGES:-2048}
    restart: unless-stopped
    init: true

    # Hardening
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 200
    healthcheck:
      # Use Node (present in distroless) to avoid curl/wget in the runtime image.
      test: ["CMD", "/nodejs/bin/node", "-e", "const p=process.env.PORT||6274; fetch(`http://127.0.0.1:$${p}/health`).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  raphael-data:
